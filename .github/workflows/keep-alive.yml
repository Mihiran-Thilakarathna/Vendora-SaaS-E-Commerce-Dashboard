# Keeps the free Render API awake so visitors don't wait for a cold start.
# Render's free tier sleeps a service after ~15 minutes without traffic; waking it takes
# 30-60 seconds. Pinging the health endpoint every 10 minutes avoids that.
#
# Notes:
# - GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days with no
#   repository activity (re-enable from the Actions tab).
# - One always-on free service fits inside Render's 750 free instance hours per month.
# - Override the URL with a repository variable named API_HEALTH_URL if the API moves.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.API_HEALTH_URL || 'https://vendora-backend-zh4z.onrender.com/api/health' }}
        run: |
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 90 "$URL") && { echo "Attempt $attempt: $body"; exit 0; }
            echo "Attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "::warning::API did not respond after 3 attempts"
